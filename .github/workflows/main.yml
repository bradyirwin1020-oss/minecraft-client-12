GRADLE_SETTINGS

          echo 'Effective settings.gradle:'
          cat settings.gradle

          if grep -Eq 'RepositoriesMode\.(PREFER_SETTINGS|FAIL_ON_PROJECT_REPOS)' settings.gradle; then
            echo 'ERROR: incompatible Gradle repository mode is still present.' >&2
            exit 1
          fi

      - name: Show build tool versions
        shell: bash
        run: |
          set -euo pipefail
          java --version
          gradle --version

      - name: Build the Fabric mod
        shell: bash
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify the compiled mod JAR
        id: verify
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -s "$JAR" ]]; then
            echo 'ERROR: no compiled mod JAR was produced.' >&2
            echo 'Build output files:'
            find build -maxdepth 4 -type f -print | sort || true
            exit 1
          fi

          jar tf "$JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$JAR" | grep -Fx 'com/aegis/client/AegisClient.class'
          echo "jar_path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Verified JAR: $JAR"
          ls -lh "$JAR"

      - name: Upload compiled mod JAR
        uses: actions/upload-artifact@v7
        with:
          name: AegisClient-Minecraft-26.1.2
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
