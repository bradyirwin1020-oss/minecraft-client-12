name: Aegis Client Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Minecraft 26.1.2 Fabric mod
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'

      - name: Prepare settings for Fabric Loom
        shell: bash
        run: |
          set -euo pipefail
          test -f build.gradle
          cat > settings.gradle <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.fabricmc.net/' }
                  gradlePluginPortal()
                  mavenCentral()
              }
          }

          rootProject.name = 'aegis-client'
          GRADLE_SETTINGS
          echo 'Gradle settings prepared:'
          cat settings.gradle

      - name: Build Aegis
        shell: bash
        run: gradle --no-daemon --stacktrace clean build

      - name: Verify the mod JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'aegis-client-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [ -z "$JAR" ]; then
            echo 'ERROR: No Aegis mod JAR was created.' >&2
            find build -maxdepth 4 -type f -print || true
            exit 1
          fi
          jar tf "$JAR" | grep -Fx 'fabric.mod.json'
          jar tf "$JAR" | grep -Fx 'com/aegis/client/AegisClient.class'
          echo "Verified JAR: $JAR"
          ls -lh "$JAR"

      - name: Upload the built JAR
        uses: actions/upload-artifact@v7
        with:
          name: AegisClient-Minecraft-26.1.2
          path: build/libs/aegis-client-2.0.0.jar
          if-no-files-found: error
          retention-days: 30
