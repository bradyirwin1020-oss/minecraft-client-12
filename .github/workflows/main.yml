name: "Build Aegis Client JAR"

'on':
  push:
    branches: ["main", "master"]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    name: "Build Minecraft 26.1.2 Fabric client"
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: "Check out source"
        uses: actions/checkout@v7

      - name: "Install JDK 25"
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: "25"
          cache: "gradle"

      - name: "Set up Gradle 9.8.2"
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"

      - name: "Prepare Fabric Loom repository settings"
        run: "bash ci/prepare-gradle.sh"

      - name: "Show build tool versions"
        shell: bash
        run: |
          java --version
          gradle --version

      - name: "Compile and package the mod"
        shell: bash
        run: "gradle --no-daemon --stacktrace clean build"

      - name: "Verify the JAR exists"
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/aegis-client-2.0.0.jar"
          test -s "$JAR"
          echo "Built JAR: $JAR"
          ls -lh "$JAR"
          jar tf "$JAR" | sed -n '1,80p'

      - name: "Upload the compiled JAR"
        uses: actions/upload-artifact@v7
        with:
          name: "AegisClient-2.0.0-Minecraft-26.1.2"
          path: "build/libs/aegis-client-2.0.0.jar"
          if-no-files-found: "error"
          retention-days: 30
