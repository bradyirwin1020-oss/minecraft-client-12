plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

// Keep dependency repositories in the project build. Fabric Loom adds its own
// LoomLocalRemappedMods repository during plugin application, so settings-level
// FAIL_ON_PROJECT_REPOS is incompatible with Loom.
repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "aegis" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version': project.version }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
    withSourcesJar()
}

jar {
    from('LICENSE') { rename { "${it}_${project.base.archivesName.get()}" } }
}
